name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:
          # setup-python has no 3.9 build for Apple silicon runners;
          # the oldest supported version is covered on Linux and Windows.
          - os: macos-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The client runs on the standard library alone; the extras are what
      # the file-format tests need, and they skip themselves without them.
      - name: Install optional dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      # The eval cases need no API key: the works live in the case files.
      - name: Score the eval cases
        run: python evals/run.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check .
